timezone: Asia/Shanghai

windows:
  - name: morning
    start: "06:30"
    end: "07:30"
  - name: evening
    start: "21:30"
    end: "22:30"

stream:
  rtsp_url: "${RTSP_URL:-rtsp://127.0.0.1:8554/xiaomi_cam}"
  reconnect_retries: 3

analysis:
  sample_fps: 2
  # Pose model: lite / full / heavy (place .task file in analyzer/models/)
  pose_model: "heavy"
  # Thresholds for Phase 2
  toothbrush_min_seconds_done: 20
  toothbrush_min_seconds_medium: 45
  toothbrush_min_seconds_good: 90
  facewash_min_seconds_done: 8
  facewash_min_seconds_medium: 15
  facewash_min_seconds_good: 30
  # Ignore short/static detections caused by walking, drinking, or touching face.
  min_segment_seconds: 5.0
  min_segment_hits: 8
  brush_min_motion: 0.020
  facewash_min_motion: 0.025

hands:
  model: "hand_landmarker.task"
  # Finger-tip distance thresholds (more precise than wrist)
  brush_finger_threshold: 0.075
  brush_wrist_threshold: 0.12
  face_finger_threshold: 0.10
  face_wrist_threshold: 0.15
  min_fingers_for_facewash: 4

roi:
  enabled: true
  # Normalized coordinates [x1, y1, x2, y2] in 0..1 range.
  # First pass based on 2026-05-12/13 evidence frames: keep the right-side
  # washstand/person area and exclude the center cabinet/chair area.
  sink_area: [0.84, 0.04, 1.0, 0.92]
  mirror_area: null
  body_area: null

storage:
  frames_dir: "./data/frames"
  clips_dir: "./data/clips"
  db_path: "./data/db/app.db"
  retention_days_frames: 7
  retention_days_clips: 7
  retention_days_logs: 90

email:
  enabled: true
  smtp_host: "${SMTP_HOST}"
  smtp_port: ${SMTP_PORT:-587}
  smtp_user: "${SMTP_USER}"
  smtp_password: "${SMTP_PASSWORD}"
  from_addr: "${EMAIL_FROM}"
  to_addr: "${EMAIL_TO}"
  use_tls: ${SMTP_USE_TLS:-true}
